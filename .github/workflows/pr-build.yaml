name: PR build check

on:
    pull_request:
        branches: [main]

permissions:
    contents: read
    pull-requests: write

concurrency:
    group: pr-build-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    build:
        name: Build theme
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build theme jar
              id: build
              shell: bash
              run: |
                  set -o pipefail
                  npm run build-keycloak-theme 2>&1 | tee build.log

            - name: Show build error
              if: failure() && steps.build.outcome == 'failure'
              shell: bash
              run: |
                  # The most useful error line: a tenant.json problem, a TypeScript error, or Maven's error.
                  FIRST_ERROR=$(grep -m1 -E "tenants/.+tenant\.json:|error TS[0-9]+|\[ERROR\]|Error:" build.log | sed 's/\x1b\[[0-9;]*m//g' || true)
                  [ -z "$FIRST_ERROR" ] && FIRST_ERROR="Build failed - see the log for details."
                  echo "::error title=Theme build failed::$FIRST_ERROR"

                  {
                      echo "## ❌ Theme build failed"
                      echo
                      echo "**First error:** \`$FIRST_ERROR\`"
                      echo
                      echo "<details><summary>Last 80 lines of the build log</summary>"
                      echo
                      echo '```'
                      tail -n 80 build.log | sed 's/\x1b\[[0-9;]*m//g'
                      echo '```'
                      echo "</details>"
                  } > error-summary.md
                  cat error-summary.md >> "$GITHUB_STEP_SUMMARY"

            - name: Comment error on pull request
              if: failure() && steps.build.outcome == 'failure'
              continue-on-error: true # comments aren't allowed on PRs from forks
              uses: actions/github-script@v7
              with:
                  script: |
                      const fs = require("fs");
                      const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
                      const body = fs.readFileSync("error-summary.md", "utf8") + `\n\n[Full build log](${run})`;
                      await github.rest.issues.createComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: context.issue.number,
                          body
                      });
