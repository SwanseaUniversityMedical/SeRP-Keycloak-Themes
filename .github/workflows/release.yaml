name: Release

on:
    push:
        branches: [main]

permissions:
    contents: write

concurrency:
    group: release # one release at a time, so two merges can't take the same version
    cancel-in-progress: false

jobs:
    release:
        name: Build and release jar
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Work out version
              id: version
              shell: bash
              run: |
                  BASE=$(node -p "require('./package.json').version" | cut -d- -f1)   # e.g. 1.2.0
                  MAJOR_MINOR="${BASE%.*}"
                  BASE_PATCH="${BASE##*.}"
                  LAST_TAG=$(git tag --list "v${MAJOR_MINOR}.*" --sort=-v:refname | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+$" | head -n1 || true)
                  if [ -z "$LAST_TAG" ]; then
                      PATCH=$BASE_PATCH
                  else
                      NEXT=$(( ${LAST_TAG##*.} + 1 ))
                      PATCH=$(( NEXT > BASE_PATCH ? NEXT : BASE_PATCH ))
                  fi
                  VERSION="${MAJOR_MINOR}.${PATCH}"
                  echo "Releasing version $VERSION (previous tag: ${LAST_TAG:-none})"
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"

            - name: Install dependencies
              run: npm ci

            - name: Set version for this build
              run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

            - name: Build theme jar
              run: npm run build-keycloak-theme

            - name: Name jar with version
              id: jar
              shell: bash
              run: |
                  JAR="serp-keycloak-themes-${{ steps.version.outputs.version }}.jar"
                  mv dist_keycloak/serp-keycloak-themes.jar "dist_keycloak/$JAR"
                  echo "path=dist_keycloak/$JAR" >> "$GITHUB_OUTPUT"
                  echo "name=$JAR" >> "$GITHUB_OUTPUT"

            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              shell: bash
              run: |
                  VERSION="${{ steps.version.outputs.version }}"
                  gh release create "v$VERSION" "${{ steps.jar.outputs.path }}" \
                      --target "$GITHUB_SHA" \
                      --title "serp-keycloak-themes v$VERSION" \
                      --generate-notes
                  {
                      echo "## ✅ Released serp-keycloak-themes v$VERSION"
                      echo
                      echo "Jar: \`${{ steps.jar.outputs.name }}\` (Keycloak 26 and newer)"
                      echo
                      echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/v$VERSION"
                  } >> "$GITHUB_STEP_SUMMARY"

